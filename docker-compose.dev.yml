services:
  saladbooru:
    build: .
    platform: linux/amd64
    user: "0:0"  # Bind-mounted data remains writable on macOS and Linux.
    read_only: true
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SALADBOORU_DATA_DIR: /data
    volumes:
      - ${SALADBOORU_DEV_DATA_DIR:-./data/tag-review}:/data
