<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saladbooru">
<title>Saladbooru</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<main>
  <header id="tag-toolbar">
    <nav id="tag-bar" aria-label="Filter by tag">
      <div id="tag-options" role="group" aria-label="Tags"></div>
      <button id="clear-filters" type="button" aria-label="Clear tag filters" title="Clear tag filters" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </nav>
    <button id="select-mode" type="button" aria-label="Select images" aria-pressed="false" title="Select images">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="m6 10 3 3 5-5M10 21h8a3 3 0 0 0 3-3V8"/></svg>
    </button>
    <button id="refresh" type="button" aria-label="Refresh gallery" title="Refresh gallery">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5M6 2v4h4M4 13a8 8 0 0 0 14 5M18 22v-4h-4"/></svg>
    </button>
  </header>
  <div id="grid" aria-label="Image gallery"></div>
  <div id="batch-actions" hidden>
    <span id="selected-count" aria-live="polite"></span>
    <button id="batch-add" type="button" aria-label="Add tags to selected images" title="Add tags">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 3h8a1 1 0 0 1 1 1v8l-9 9a2 2 0 0 1-2.8 0L3 14.8a2 2 0 0 1 0-2.8Z"/><circle cx="17" cy="7" r="1"/><path d="M18.5 15.5v6m-3-3h6"/></svg>
    </button>
    <button id="batch-remove" type="button" aria-label="Remove tags from selected images" title="Remove tags">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 3h8a1 1 0 0 1 1 1v8l-9 9a2 2 0 0 1-2.8 0L3 14.8a2 2 0 0 1 0-2.8Z"/><circle cx="17" cy="7" r="1"/><path d="M15.5 18.5h6"/></svg>
    </button>
    <button id="batch-delete" type="button" aria-label="Delete selected images" title="Delete images">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v6m4-6v6"/></svg>
    </button>
    <button id="batch-clear" type="button" aria-label="Cancel selection" title="Cancel selection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg>
    </button>
  </div>
  <div id="drop-overlay" role="status" hidden>Drop images to upload</div>
  <article id="detail" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <a id="back" href="/" aria-label="Back to gallery">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg>
    </a>
    <img id="full" alt="Full-size image" draggable="false">
    <div id="detail-actions">
      <button id="tags-open" type="button" aria-label="Edit image tags" title="Edit image tags" aria-haspopup="dialog" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3.4 13.4a2 2 0 0 1 0-2.8l7.2-7.2A2 2 0 0 1 12 2.8h7.2a2 2 0 0 1 2 2V12a2 2 0 0 1-.6 1.4Z"/><circle cx="16.5" cy="7.5" r="1"/></svg>
      </button>
      <button id="delete-post" type="button" aria-label="Delete image" title="Delete image">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v6m4-6v6"/></svg>
      </button>
    </div>
    <p id="detail-status" role="status"></p>
  </article>
  <dialog id="tags-sheet" class="sheet" aria-labelledby="tags-title">
    <h2 id="tags-title" tabindex="-1">Tags</h2>
    <div id="tag-chips" class="tag-chips" aria-label="Current tags"></div>
    <label for="tag-name">Add tag</label>
    <input id="tag-name" type="text" autocomplete="off" placeholder="Press Enter to add">
    <div id="tag-suggestions" class="tag-options" aria-label="Existing tags" hidden></div>
    <p id="tag-error" role="alert"></p>
    <div class="sheet-actions">
      <button id="tag-save" type="button">Save</button>
    </div>
  </dialog>
  <p id="status" role="status"></p>
</main>
<script type="module" src="/app.js"></script>
</html>
