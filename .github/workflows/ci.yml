name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install native test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebp-dev
      - name: Check and build frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check and test backend
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: saladbooru:ci
          cache-from: type=gha,scope=saladbooru
          cache-to: type=gha,mode=max,scope=saladbooru
      - name: Smoke-test image executable
        run: docker run --rm --entrypoint /saladbooru saladbooru:ci --help

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mi2428/saladbooru:sha-${{ github.sha }}
            ghcr.io/mi2428/saladbooru:latest
          labels: |
            org.opencontainers.image.source=https://github.com/mi2428/saladbooru
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=saladbooru
          cache-to: type=gha,mode=max,scope=saladbooru
