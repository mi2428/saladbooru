apiVersion: batch/v1
kind: CronJob
metadata:
  name: saladbooru-dedupe
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dedupe
              image: saladbooru:latest
              command: [/saladbooru, -dedupe]
              env:
                - name: SALADBOORU_DATA_DIR
                  value: /data
                - name: SALADBOORU_DEDUPE_SIMILAR
                  value: "true"
                - name: SALADBOORU_DEDUPE_PHASH_MAX_DISTANCE
                  value: "4"
                - name: SALADBOORU_DEDUPE_DHASH_MAX_DISTANCE
                  value: "4"
                - name: SALADBOORU_DEDUPE_SSIM_MIN
                  value: "0.90"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: saladbooru-data
