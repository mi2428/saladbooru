apiVersion: apps/v1
kind: Deployment
metadata:
  name: saladbooru
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: saladbooru
  template:
    metadata:
      labels:
        app: saladbooru
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: saladbooru
          image: saladbooru:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SALADBOORU_DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: saladbooru-data
